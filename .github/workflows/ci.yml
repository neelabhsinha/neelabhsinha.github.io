name: 🔄 Continuous Integration

on:
  pull_request:
    branches: ['main', 'v3.x']
  push:
    branches: ['main', 'v3.x']

jobs:
  test:
    name: 🧪 Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: 📋 Install dependencies
        run: npm ci
        
      - name: 🔍 Lint code
        run: npm run lint --if-present
        
      - name: 🧪 Run tests
        run: npm test --if-present
        
      - name: 🏗️ Test build
        run: npm run build
